<style>
:root{
  --navy: #0F1B2E;
  --paper: #FBF9F5;
  --line: #E4E0D6;
  --ink: #17212F;
  --muted: #5B6472;
  --gold: #B8873F;
  --white: #ffffff;
  --ease: cubic-bezier(.25,.8,.35,1);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-family:'Inter', sans-serif;
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 520px at 85% -10%, rgba(184,135,63,0.12), transparent 60%),
    radial-gradient(700px 480px at 0% 110%, rgba(15,27,46,0.06), transparent 55%),
    var(--paper);
}

/* ===== TOP BAR ===== */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:18px clamp(20px, 5vw, 48px);
}
.logo{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:1.15rem;
  color:var(--navy);
  text-decoration:none;
  letter-spacing:-0.01em;
}
.logo em{color:var(--gold); font-style:normal;}
.top-actions{display:flex; align-items:center; gap:14px;}
.home-link{
  font-size:.85rem;
  font-weight:600;
  color:var(--navy);
  text-decoration:none;
  border-bottom:2px solid rgba(184,135,63,.5);
  padding-bottom:2px;
}
.home-link:hover{border-color:var(--gold);}

/* ===== LANGUAGE SWITCHER ===== */
.lang-switcher{
  display:inline-flex;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px;
  gap:2px;
}
.lang-switcher button{
  border:0;
  background:transparent;
  font-family:'Inter', sans-serif;
  font-weight:600;
  font-size:.78rem;
  padding:7px 14px;
  border-radius:999px;
  cursor:pointer;
  color:var(--muted);
  transition:all .25s var(--ease);
}
.lang-switcher button.active{background:var(--navy); color:var(--white);}
.lang-switcher button:not(.active):hover{color:var(--navy);}

/* ===== PAGE ===== */
main{
  flex:1;
  width:100%;
  max-width:860px;
  margin:0 auto;
  padding:12px clamp(20px, 5vw, 32px) 64px;
}
.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:26px;
  padding:clamp(28px, 6vw, 52px);
  box-shadow:0 30px 70px -35px rgba(15,27,46,0.35);
  animation:cardIn .6s var(--ease) both;
}
@keyframes cardIn{
  from{opacity:0; transform:translateY(16px);}
  to{opacity:1; transform:none;}
}

.eyebrow{
  display:inline-block;
  font-size:.75rem;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:14px;
}
h1{
  font-family:'Fraunces', serif;
  font-weight:600;
  color:var(--navy);
  font-size:clamp(1.9rem, 5vw, 2.6rem);
  letter-spacing:-0.01em;
  line-height:1.12;
  margin-bottom:16px;
}
.intro-text{
  color:var(--muted);
  font-size:1.02rem;
  margin-bottom:26px;
}

/* ===== TABS ===== */
.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:30px;
}
.tab-btn{
  font-family:'Inter', sans-serif;
  font-size:.82rem;
  font-weight:600;
  padding:9px 18px;
  border-radius:999px;
  cursor:pointer;
  color:var(--muted);
  background:transparent;
  border:1px solid var(--line);
  transition:all .25s var(--ease);
}
.tab-btn:hover{border-color:var(--gold); color:var(--gold);}
.tab-btn.active{
  background:var(--navy);
  color:#fff;
  border-color:var(--navy);
}
html.dark .tab-btn.active{color:#F5F6F8;}

/* ===== FLASHCARD ===== */
.flash-zone{
  max-width:560px;
  margin:0 auto;
  text-align:center;
}
.flash3d{
  perspective:1200px;
  margin-bottom:26px;
  cursor:pointer;
}
.flash-inner{
  position:relative;
  width:100%;
  min-height:320px;
  transform-style:preserve-3d;
  transition:transform .55s var(--ease);
}
.flash-inner.flipped{transform:rotateY(180deg);}
.flash-face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:34px 30px;
  border-radius:26px;
  border:1px solid var(--line);
  background:var(--paper);
}
.flash-back{
  transform:rotateY(180deg);
  background:var(--navy);
  border-color:transparent;
}
html.dark .flash-face{background:#151B24;}
html.dark .flash-back{background:var(--navy);}
.flash-word{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:clamp(1.9rem, 6vw, 2.5rem);
  color:var(--navy);
  letter-spacing:-0.01em;
  word-break:break-word;
}
html.dark .flash-word{color:var(--ink);}
.flash-pos{
  font-size:.72rem;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold);
  border:1px solid rgba(184,135,63,.4);
  padding:4px 12px;
  border-radius:999px;
}
.flash-sound{
  width:46px;
  height:46px;
  border-radius:50%;
  border:0;
  background:var(--navy);
  color:#fff;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:transform .25s var(--ease);
}
html.dark .flash-sound{color:#F5F6F8;}
.flash-sound:hover{transform:scale(1.1);}
.flash-hint{
  font-size:.82rem;
  color:var(--muted);
  letter-spacing:.04em;
}
.flash-def{
  font-size:1.05rem;
  color:var(--white);
  font-weight:500;
  max-width:440px;
}
.flash-ar{
  font-size:.95rem;
  color:var(--gold-light, #E4BE7E);
  max-width:440px;
}
.flash-ex{
  font-size:.88rem;
  color:rgba(230,233,238,.82);
  max-width:440px;
  border-top:1px solid rgba(230,233,238,.18);
  padding-top:12px;
}
.flash-ex b{color:var(--gold-light, #E4BE7E); font-weight:600; margin-right:8px;}

/* ===== CONTROLS ===== */
.flash-controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
}
.ctl-btn{
  width:44px;
  height:44px;
  border-radius:50%;
  border:1px solid var(--line);
  background:transparent;
  color:var(--navy);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all .25s var(--ease);
}
html.dark .ctl-btn{color:var(--ink);}
.ctl-btn:hover{border-color:var(--gold); color:var(--gold); transform:translateY(-2px);}
.flash-counter{
  font-size:.85rem;
  font-weight:600;
  color:var(--muted);
  min-width:110px;
}
.track{
  height:6px;
  border-radius:999px;
  background:var(--line);
  margin:16px auto 0;
  max-width:400px;
  overflow:hidden;
}
.track-fill{
  height:100%;
  width:0%;
  border-radius:999px;
  background:var(--gold);
  transition:width .3s var(--ease);
}

/* ===== BUTTONS ===== */
.btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-family:'Inter', sans-serif;
  font-size:.95rem;
  font-weight:600;
  padding:15px 30px;
  border-radius:999px;
  cursor:pointer;
  text-decoration:none;
  border:1px solid transparent;
  transition:all .3s var(--ease);
}
.btn-ghost{background:transparent; color:var(--navy); border-color:var(--line);}
.btn-ghost:hover{border-color:var(--gold); color:var(--gold);}
.back{margin-top:34px; display:inline-block; font-size:.88rem; color:var(--muted); text-decoration:none;}
.back:hover{color:var(--gold);}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:26px 20px 34px;
  color:var(--muted);
  font-size:.82rem;
}
footer a{color:var(--navy); font-weight:600; text-decoration:none; border-bottom:1px solid rgba(184,135,63,.5);}

@media (max-width:480px){
  .logo{font-size:1rem;}
  .home-link{font-size:.8rem;}
  .flash-inner{min-height:300px;}
}

/* ===== DARK MODE ===== */
html.dark{
  --paper:#0D1117;
  --paper-2:#151B24;
  --line:#2A323F;
  --ink:#E6E9EE;
  --muted:#9AA6B5;
  --muted-light:#6E7A8C;
  --white:#12171F;
  --gold:#D6A65C;
  --gold-light:#E4BE7E;
  --navy-2:#1B2433;
  --navy-soft:#26364E;
  --shadow-soft:0 20px 50px -25px rgba(0,0,0,.6);
  --shadow-card:0 10px 30px -15px rgba(0,0,0,.55);
}
html.dark body{color:var(--ink);}
html.dark h1,html.dark h2,html.dark h3,html.dark h4,
html.dark .logo,html.dark .btn-ghost,html.dark .btn-ghost:hover,
html.dark footer a,html.dark .home-link,.theme-toggle,
html.dark .lang-switcher button:not(.active){
  color:var(--ink);
}
html.dark .card{background:#12171F;}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;flex:0 0 36px;border:1px solid var(--line);border-radius:50%;color:var(--ink);background:transparent;transition:border-color .3s var(--ease),color .3s var(--ease);text-decoration:none;}
.theme-toggle:hover{border-color:var(--gold);color:var(--gold);}
.theme-toggle svg{display:block;}
.theme-toggle .icon-sun{display:none;}
html.dark .theme-toggle .icon-moon{display:none;}
html.dark .theme-toggle .icon-sun{display:block;}
html.dark .lang-switcher button.active,
html.dark .btn-navy{color:#F5F6F8;background:var(--navy);}
html.dark input,html.dark select,html.dark textarea{background:#151B24;color:var(--ink);border-color:var(--line);}
</style>
<script>(function(){var t=null;try{t=localStorage.getItem('siteTheme')}catch(e){}if(!t){try{t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){t='light'}}if(t==='dark')document.documentElement.classList.add('dark')})();</script>

<header class="topbar">

    <span class="eyebrow">Vocabulary Cards</span>

</main>

<script>
(function(){
  const DECK_DATA = {
    general: {
      label: {en: "General", ar: "عام"},
      cards: [
        {w:"achieve", pos:"verb", def:"To succeed in reaching a goal after effort.", ar:"يحقق - أن تنجح في بلوغ هدف بعد جهد.", ex:"I want to achieve my dream of speaking English fluently.", exAr:"أريد أن أحقق حلمي في التحدث بالإنجليزية بطلاقة."},
        {w:"improve", pos:"verb", def:"To make or become better.", ar:"يحسن - أن تجعل شيئًا أفضل.", ex:"Practice every day to improve your skills.", exAr:"درّب كل يوم لتحسّن مهاراتك."},
        {w:"practice", pos:"verb", def:"To do something regularly to become good at it.", ar:"يتدرب - أن تفعل شيئًا بانتظام لتتقنه.", ex:"Practice speaking with a partner.", exAr:"تدرب على التحدث مع شريك."},
        {w:"communicate", pos:"verb", def:"To share information, ideas, or feelings with others.", ar:"يتواصل - أن تشارك معلومات أو أفكارًا مع الآخرين.", ex:"We communicate better when we listen carefully.", exAr:"نتواصل بشكل أفضل عندما نستمع بانتباه."},
        {w:"confident", pos:"adj", def:"Feeling sure about your own abilities.", ar:"واثق - تشعر باليقين تجاه قدراتك.", ex:"She feels confident before the exam.", exAr:"تشعر بالثقة قبل الامتحان."},
        {w:"fluent", pos:"adj", def:"Able to speak a language easily and smoothly.", ar:"طليق - تستطيع التحدث بلغة بسهولة وسلاسة.", ex:"He is fluent in three languages.", exAr:"هو طليق في ثلاث لغات."},
        {w:"opportunity", pos:"noun", def:"A chance to do something useful or valuable.", ar:"فرصة - شعور بأنك تستطيع فعل شيء قيّم.", ex:"Good English opens many opportunities.", exAr:"الإنجليزية الجيدة تفتح فرصًا كثيرة."},
        {w:"effort", pos:"noun", def:"Physical or mental energy used to do something.", ar:"جهد - طاقة بدنية أو ذهنية تُبذل لفعل شيء.", ex:"Success needs regular effort.", exAr:"النجاح يحتاج جهدًا منتظمًا."},
        {w:"habit", pos:"noun", def:"Something you do often without thinking about it.", ar:"عادة - شيء تفعله باستمرار دون تفكير.", ex:"Reading before bed became a good habit.", exAr:"القراءة قبل النوم أصبحت عادة جيدة."},
        {w:"goal", pos:"noun", def:"Something that you aim for and work to achieve.", ar:"هدف - شيء تسعى إليه وتعمل لتحقيقه.", ex:"My goal is to speak English at work.", exAr:"هدفي أن أتحدث الإنجليزية في العمل."},
        {w:"begin", pos:"verb", def:"To start something.", ar:"يبدأ - أن يبدأ شيئًا ما.", ex:"Let's begin with simple conversations.", exAr:"لنبدأ بالمحادثات البسيطة."},
        {w:"remember", pos:"verb", def:"To keep something in your mind.", ar:"يتذكر - يبقي شيئًا في ذاكرته.", ex:"Remember new words by using them.", exAr:"تذكر الكلمات الجديدة باستخدامها."}
      ]
    },
    business: {
      label: {en: "Business", ar: "أعمال"},
      cards: [
        {w:"negotiate", pos:"verb", def:"To discuss something to reach an agreement.", ar:"يتفاوض - يناقش للوصول إلى اتفاق.", ex:"We need to negotiate the price.", exAr:"نحتاج إلى التفاوض حول السعر."},
        {w:"deadline", pos:"noun", def:"The latest time by which something must be finished.", ar:"موعد نهائي - آخر وقت لإنجاز شيء.", ex:"The deadline for the report is Friday.", exAr:"الموعد النهائي للتقرير يوم الجمعة."},
        {w:"budget", pos:"noun", def:"The amount of money you plan to spend.", ar:"ميزانية - المبلغ المخطط لإنفاقه.", ex:"Keep the project within budget.", exAr:"أبقِ المشروع ضمن الميزانية."},
        {w:"profit", pos:"noun", def:"Money you gain after paying costs.", ar:"ربح - المال الذي تكسبه بعد دفع التكاليف.", ex:"The company made a good profit this year.", exAr:"حققت الشركة ربحًا جيدًا هذا العام."},
        {w:"customer", pos:"noun", def:"A person who buys goods or services.", ar:"عميل - شخص يشتري سلعًا أو خدمات.", ex:"Our customers love the new product.", exAr:"عملاؤنا يعشقون المنتج الجديد."},

        {w:"invoice", pos:"noun", def:"A document listing what someone owes for goods or services.", ar:"فاتورة - مستند يُظهر ما يدين به شخص مقابل سلع أو خدمات.", ex:"Please send the invoice by email.", exAr:"أرسل الفاتورة عبر البريد من فضلك."},
        {w:"marketing", pos:"noun", def:"The business of promoting and selling products.", ar:"تسويق - عمل ترويج المنتجات وبيعها.", ex:"Good marketing attracts more customers.", exAr:"التسويق الجيد يجذب مزيدًا من العملاء."},
        {w:"recruitment", pos:"noun", def:"The process of finding and hiring new people.", ar:"توظيف - عملية البحث عن موظفين جدد وتعيينهم.", ex:"Recruitment takes time and care.", exAr:"التوظيف يحتاج وقتًا وعناية."},

    },
    ielts: {

        {w:"task", pos:"noun", def:"A piece of work you are asked to do in the exam.", ar:"مهمة - عمل تطلب منك القيام به في الامتحان.", ex:"Answer each task within the time.", exAr:"أجب عن كل مهمة في وقتها."},

        {w:"comprehension", pos:"noun", def:"The ability to understand what you read or hear.", ar:"فهم - القدرة على إدراك ما تقرأ أو تسمع.", ex:"Use headings to improve comprehension.", exAr:"استخدم العناوين لتحسين الفهم."},
        {w:"synonym", pos:"noun", def:"A word with the same or similar meaning as another.", ar:"مرادف - كلمة لها نفس معنى كلمة أخرى.", ex:"Happy is a synonym of glad.", exAr:"كلمة happy مرادفة لكلمة glad."},

        {w:"examiner", pos:"noun", def:"The person who tests and evaluates you.", ar:"ممتحن - الشخص الذي يختبرك ويقيمك.", ex:"Speak clearly with the examiner.", exAr:"تحدث بوضوح مع الممتحن."},
        {w:"fluency", pos:"noun", def:"The ability to speak smoothly and easily.", ar:"طلاقة - القدرة على التحدث بسلاسة ويسر.", ex:"Fluency comes with daily practice.", exAr:"الطلاقة تأتي مع التدريب اليومي."},
        {w:"coherence", pos:"noun", def:"Ideas connected in a clear and logical way.", ar:"ترابط - أفكار مرتبطة بشكل واضح ومنطقي.", ex:"Use linking words to improve coherence.", exAr:"استخدم كلمات الربط لتحسين الترابط."},
        {w:"vocabulary", pos:"noun", def:"The words you know and use in a language.", ar:"مفردات - الكلمات التي تعرفها وتستخدمها.", ex:"A wide vocabulary boosts your score.", exAr:"المفردات الواسعة ترفع درجتك."},
        {w:"grammar", pos:"noun", def:"The rules for forming sentences in a language.", ar:"قواعد - قواعد تكوين الجمل في لغة.", ex:"Grammar mistakes lower your band.", exAr:"أخطاء القواعد تخفض درجتك."},
        {w:"score", pos:"noun", def:"The number of points you get in an exam.", ar:"درجة - عدد النقاط التي تحصل عليها.", ex:"Practice tests improve your score.", exAr:"الاختبارات التدريبية تحسّن درجتك."}
      ]
    },
    sat: {
      label: {en: "SAT", ar: "سات"},
      cards: [
        {w:"analyze", pos:"verb", def:"To examine something carefully in detail.", ar:"يحلل - يفحص شيئًا بعناية وبالتفصيل.", ex:"Analyze the author's main argument.", exAr:"حلّل الحجة الرئيسية للكاتب."},
        {w:"inference", pos:"noun", def:"A conclusion you reach from evidence.", ar:"استنتاج - استدلال تصل إليه من الأدلة.", ex:"The inference is supported by the text.", exAr:"الاستنتاج مدعوم بالنص."},
        {w:"evidence", pos:"noun", def:"Information that proves something.", ar:"دليل - معلومات تثبت شيئًا.", ex:"Find evidence before you choose.", exAr:"ابحث عن الدليل قبل أن تختار."},
        {w:"argument", pos:"noun", def:"A set of reasons for or against something.", ar:"حجة - مجموعة أسباب تؤيد شيئًا أو تعارضه.", ex:"The argument builds step by step.", exAr:"الحجة تُبنى خطوة بخطوة."},
        {w:"synthesize", pos:"verb", def:"To combine ideas to make something new.", ar:"يولّف - يجمع أفكارًا ليصنع شيئًا جديدًا.", ex:"Synthesize the main points in one sentence.", exAr:"ولّف النقاط الرئيسية في جملة واحدة."},
        {w:"imply", pos:"verb", def:"To suggest something without saying it directly.", ar:"يوحي - يقترح شيئًا دون قوله مباشرة.", ex:"The tone implies the writer is doubtful.", exAr:"النبرة توحي بأن الكاتب متشكك."},
        {w:"contradict", pos:"verb", def:"To state the opposite of what was said.", ar:"يناقض - يذكر عكس ما قيل.", ex:"The example contradicts the claim.", exAr:"المثال يناقض الادعاء."},
        {w:"persuade", pos:"verb", def:"To make someone believe or do something.", ar:"يقنع - يجعل شخصًا يصدق شيئًا أو يفعله.", ex:"The author tries to persuade readers.", exAr:"يحاول الكاتب إقناع القراء."},
        {w:"concise", pos:"adj", def:"Short and clear, without extra words.", ar:"موجز - قصير وواضح دون كلمات زائدة.", ex:"Choose the most concise answer.", exAr:"اختر الإجابة الأكثر إيجازًا."},
        {w:"figurative", pos:"adj", def:"Using words with meanings beyond the literal.", ar:"مجازي - يستخدم الكلمات بمعانٍ أبعد من المعنى الحرفي.", ex:"The line has a figurative meaning.", exAr:"السطر له معنى مجازي."},
        {w:"connotation", pos:"noun", def:"An idea a word suggests beyond its meaning.", ar:"دلالة - فكرة توحي بها كلمة أبعد من معناها.", ex:"The word has a positive connotation.", exAr:"الكلمة تحمل دلالة إيجابية."},
        {w:"evaluate", pos:"verb", def:"To judge the value or quality of something.", ar:"يقيّم - يحكم على قيمة شيء أو جودته.", ex:"Evaluate the strength of each answer.", exAr:"قيّم قوة كل إجابة."}
      ]
    },
    toefl: {
      label: {en: "TOEFL", ar: "توفل"},
      cards: [
        {w:"lecture", pos:"noun", def:"A talk given to teach a topic.", ar:"محاضرة - حديث يُلقى لتعليم موضوع.", ex:"The lecture covered climate change.", exAr:"غطت المحاضرة موضوع تغير المناخ."},
        {w:"conversation", pos:"noun", def:"An informal talk between people.", ar:"محادثة - حديث غير رسمي بين أشخاص.", ex:"The conversation is about registration.", exAr:"المحادثة حول التسجيل."},
        {w:"campus", pos:"noun", def:"The grounds and buildings of a university.", ar:"حرم جامعي - مباني الجامعة وأرضها.", ex:"The new library is on campus.", exAr:"المكتبة الجديدة في الحرم الجامعي."},
        {w:"essay", pos:"noun", def:"A piece of writing on one topic.", ar:"مقال - كتابة حول موضوع واحد.", ex:"Structure your essay with paragraphs.", exAr:"نظم مقالك باستخدام فقرات."},
        {w:"integrated", pos:"adj", def:"Combining different skills together.", ar:"مدمج - يجمع مهارات مختلفة معًا.", ex:"The integrated task uses reading and listening.", exAr:"المهمة المدمجة تستخدم القراءة والاستماع."},
        {w:"independent", pos:"adj", def:"Done without help from others.", ar:"مستقل - يُنجز دون مساعدة الآخرين.", ex:"The independent task is your opinion.", exAr:"المهمة المستقلة تعرض رأيك."},
        {w:"note-taking", pos:"noun", def:"Writing down key ideas while listening.", ar:"تدوين الملاحظات - كتابة الأفكار المهمة أثناء الاستماع.", ex:"Good note-taking saves time.", exAr:"تدوين الملاحظات الجيد يوفّر الوقت."},
        {w:"outline", pos:"noun", def:"A short plan of the main ideas.", ar:"مخطط - خطة قصيرة للأفكار الرئيسية.", ex:"Write an outline before the essay.", exAr:"اكتب مخططًا قبل المقال."},
        {w:"summarize", pos:"verb", def:"To state the main points briefly.", ar:"يلخص - يعرض النقاط الرئيسية باختصار.", ex:"Summarize the lecture in a few lines.", exAr:"لخّص المحاضرة في بضعة أسطر."},
        {w:"pronunciation", pos:"noun", def:"The way a word is said.", ar:"نطق - الطريقة التي تُقال بها كلمة.", ex:"Clear pronunciation matters in speaking.", exAr:"النطق الواضح مهم في التحدث."},
        {w:"registration", pos:"noun", def:"The process of signing up for something.", ar:"تسجيل - عملية التسجيل في شيء.", ex:"Registration closes tomorrow.", exAr:"التسجيل يُغلق غدًا."},
        {w:"dormitory", pos:"noun", def:"A building where students live.", ar:"سكن طلابي - مبنى يسكن فيه الطلاب.", ex:"The dormitory is near the library.", exAr:"السكن الطلابي قريب من المكتبة."}
      ]
    }
  };

  const root = document.getElementById('deckRoot');
  const flashInner = document.createElement('div');
  flashInner.className = 'flash-inner';
  flashInner.innerHTML =
    '<div class="flash-face flash-front">' +
      '<span class="flash-word" id="fWord"></span>' +
      '<span class="flash-pos" id="fPos"></span>' +
      '<button type="button" class="flash-sound" id="fSound" aria-label="Listen">' +
        '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>' +
      '</button>' +
      '<span class="flash-hint" id="fHint"></span>' +
    '</div>' +
    '<div class="flash-face flash-back">' +
      '<p class="flash-def" id="fDef"></p>' +
      '<p class="flash-ar" id="fArabic"></p>' +
      '<p class="flash-ex" id="fEx"></p>' +
    '</div>';

  const tabsWrap = document.createElement('div');
  tabsWrap.className = 'tabs';
  tabsWrap.id = 'fTabs';

  const flashZone = document.createElement('div');
  flashZone.className = 'flash-zone';
  const flash3d = document.createElement('div');
  flash3d.className = 'flash3d';
  flash3d.appendChild(flashInner);
  const controls = document.createElement('div');
  controls.className = 'flash-controls';
  controls.id = 'fControls';

  const track = document.createElement('div');
  track.className = 'track';
  track.innerHTML = '<div class="track-fill" id="fFill"></div>';

  flashZone.appendChild(flash3d);
  flashZone.appendChild(controls);
  flashZone.appendChild(track);

  root.appendChild(tabsWrap);
  root.appendChild(flashZone);

  const el = {
    word: document.getElementById('fWord'),
    pos: document.getElementById('fPos'),
    sound: document.getElementById('fSound'),
    hint: document.getElementById('fHint'),
    def: document.getElementById('fDef'),
    ar: document.getElementById('fArabic'),
    ex: document.getElementById('fEx'),
    fill: document.getElementById('fFill')
  };

  let LANG = 'en';
  let deckKey = 'general';
  let index = 0;
  let order = [];

  function labels(l) {
    return {prev: l === 'ar' ? 'السابق' : 'Previous', next: l === 'ar' ? 'التالي' : 'Next',
            shuffle: l === 'ar' ? 'خلط' : 'Shuffle', hint: l === 'ar' ? 'اضغط على البطاقة لرؤية المعنى' : 'Tap the card to see the meaning'};
  }

  function buildTabs() {
    tabsWrap.innerHTML = '';
    Object.keys(DECK_DATA).forEach(function (key) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab-btn' + (key === deckKey ? ' active' : '');
      b.textContent = DECK_DATA[key].label[LANG];
      b.setAttribute('data-deck', key);
      b.addEventListener('click', function () {
        deckKey = key;
        index = 0;
        order = [];
        buildTabs();
        renderCard();
      });
      tabsWrap.appendChild(b);
    });
  }

  function buildControls() {
    controls.innerHTML = '';
    const lab = labels(LANG);
    const prev = document.createElement('button');
    prev.type = 'button';
    prev.className = 'ctl-btn';
    prev.setAttribute('aria-label', lab.prev);
    prev.title = lab.prev;
    prev.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>';
    prev.addEventListener('click', function () { move(-1); });
    const counter = document.createElement('span');
    counter.className = 'flash-counter';
    counter.id = 'fCounter';
    const next = document.createElement('button');
    next.type = 'button';
    next.className = 'ctl-btn';
    next.setAttribute('aria-label', lab.next);
    next.title = lab.next;
    next.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';
    next.addEventListener('click', function () { move(1); });
    const shuffle = document.createElement('button');
    shuffle.type = 'button';
    shuffle.className = 'ctl-btn';
    shuffle.setAttribute('aria-label', lab.shuffle);
    shuffle.title = lab.shuffle;
    shuffle.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20l16-16M21 3l-7 7M4 4l16 16M3 16v5h5"/></svg>';
    shuffle.addEventListener('click', function () { shuffleDeck(); });
    controls.appendChild(prev);
    controls.appendChild(counter);
    controls.appendChild(next);
    controls.appendChild(shuffle);
  }

  function currentDeck() {
    if (!order.length) order = DECK_DATA[deckKey].cards.map(function (_, i) { return i; });
    return order;
  }

  function renderCard() {
    const deck = currentDeck();
    const total = deck.length;
    if (index >= total) index = 0;
    const card = DECK_DATA[deckKey].cards[deck[index]];
    el.word.textContent = card.w;
    el.pos.textContent = card.pos;
    el.hint.textContent = labels(LANG).hint;
    el.def.textContent = card.def;
    el.ar.textContent = card.ar;
    el.ex.textContent = LANG === 'ar' ? card.exAr : card.ex;
    const c = document.getElementById('fCounter');
    if (c) c.textContent = (index + 1) + ' / ' + total;
    el.fill.style.width = ((index + 1) / total * 100) + '%';
    flashInner.classList.remove('flipped');
  }

  function move(d) {
    const deck = currentDeck();
    index = (index + d + deck.length) % deck.length;
    renderCard();
  }

  function shuffleDeck() {
    const deck = currentDeck();
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
    }
    index = 0;
    renderCard();
  }

  flash3d.addEventListener('click', function () {
    flashInner.classList.toggle('flipped');
  });
  el.sound.addEventListener('click', function (ev) {
    ev.stopPropagation();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(el.word.textContent);
      u.lang = 'en-US';
      window.speechSynthesis.speak(u);
    }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'ArrowLeft') move(-1);
    if (ev.key === 'ArrowRight') move(1);
  });

  function renderAll() {
    buildTabs();
    buildControls();
    renderCard();
  }

  const original = new WeakMap();

  function translateChrome(l) {
    const dict = {
      "Back to Home": "العودة للرئيسية",
      "Vocabulary Cards": "بطاقات المفردات",
      "Flip the card, listen to the word, and repeat it aloud — meanings and examples in both English and Arabic.": "اقلب البطاقة، استمع إلى الكلمة، وكررها بصوت عالٍ — المعاني والأمثلة بالإنجليزية والعربية.",
      "© 2026 Abu Bakr Mukhtar": "© 2026 أبو بكر مختار",
      "Online English Lessons": "دروس إنجليزية أونلاين"
    };
    const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let n;
    while ((n = w.nextNode())) nodes.push(n);
    nodes.forEach(function (x) {
      const p = x.parentElement;
      if (!p || ['SCRIPT', 'STYLE'].includes(p.tagName)) return;
      if (p.closest && p.closest('#deckRoot')) return;
      if (!original.has(x)) original.set(x, x.nodeValue);
      const en = original.get(x).trim();
      if (!en) return;
      if (l === 'ar' && dict[en]) {
        x.nodeValue = x.nodeValue.replace(en, dict[en]);
      } else if (l === 'en') {
        x.nodeValue = original.get(x);
      }
    });
  }

  function apply(l) {
    LANG = l;
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('#langSwitcher button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.lang === l);
    });
    translateChrome(l);
    renderAll();
    try { localStorage.setItem('siteLanguage', l); } catch (e) {}
  }

  function init(l) {
    apply(l);
  }

  const btns = document.querySelectorAll('#langSwitcher button');
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      apply(b.dataset.lang);
    });
  });

  let s = null;
  try { s = localStorage.getItem('siteLanguage'); } catch (e) {}
  if (!s) {
    const nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
    s = nav.startsWith('ar') ? 'ar' : 'en';
  }
  init(s);
})();
</script>

<script src="assets/theme.js"></script>
</body>
</html>

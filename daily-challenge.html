<style>
:root{
  --navy: #0F1B2E;
  --paper: #FBF9F5;
  --line: #E4E0D6;
  --ink: #17212F;
  --muted: #5B6472;
  --gold: #B8873F;
  --gold-light: #E4BE7E;
  --white: #ffffff;
  --green: #1F7A4D;
  --red: #B3473F;
  --ease: cubic-bezier(.25,.8,.35,1);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-family:'Inter', sans-serif;
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 520px at 85% -10%, rgba(184,135,63,0.12), transparent 60%),
    radial-gradient(700px 480px at 0% 110%, rgba(15,27,46,0.06), transparent 55%),
    var(--paper);
}

/* ===== TOP BAR ===== */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:18px clamp(20px, 5vw, 48px);
}
.logo{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:1.15rem;
  color:var(--navy);
  text-decoration:none;
  letter-spacing:-0.01em;
}
.logo em{color:var(--gold); font-style:normal;}
.top-actions{display:flex; align-items:center; gap:14px;}
.home-link{
  font-size:.85rem;
  font-weight:600;
  color:var(--navy);
  text-decoration:none;
  border-bottom:2px solid rgba(184,135,63,.5);
  padding-bottom:2px;
}
.home-link:hover{border-color:var(--gold);}

/* ===== LANGUAGE SWITCHER ===== */
.lang-switcher{
  display:inline-flex;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px;
  gap:2px;
}
.lang-switcher button{
  border:0;
  background:transparent;
  font-family:'Inter', sans-serif;
  font-weight:600;
  font-size:.78rem;
  padding:7px 14px;
  border-radius:999px;
  cursor:pointer;
  color:var(--muted);
  transition:all .25s var(--ease);
}
.lang-switcher button.active{background:var(--navy); color:var(--white);}
.lang-switcher button:not(.active):hover{color:var(--navy);}

/* ===== PAGE ===== */
main{
  flex:1;
  width:100%;
  max-width:780px;
  margin:0 auto;
  padding:12px clamp(20px, 5vw, 32px) 64px;
}
.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:26px;
  padding:clamp(24px, 5vw, 44px);
  box-shadow:0 30px 70px -35px rgba(15,27,46,0.35);
}
.card.lead{animation:cardIn .6s var(--ease) both;}
@keyframes cardIn{
  from{opacity:0; transform:translateY(16px);}
  to{opacity:1; transform:none;}
}

.eyebrow{
  display:inline-block;
  font-size:.75rem;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:14px;
}
h1{
  font-family:'Fraunces', serif;
  font-weight:600;
  color:var(--navy);
  font-size:clamp(1.9rem, 5vw, 2.6rem);
  letter-spacing:-0.01em;
  line-height:1.12;
  margin-bottom:16px;
}
.intro-text{
  color:var(--muted);
  font-size:1.02rem;
  margin-bottom:22px;
}

/* ===== STREAK ===== */
.streak-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
  padding:14px 18px;
  border:1px dashed var(--line);
  border-radius:18px;
  margin-bottom:24px;
}
.streak-chip{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-weight:700;
  color:var(--navy);
}
html.dark .streak-chip{color:var(--ink);}
.streak-flame{
  width:38px; height:38px;
  border-radius:50%;
  background:linear-gradient(135deg,#F2C14E,#E8823A);
  color:#fff;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:1.15rem;
}
.streak-num{font-family:'Fraunces', serif; font-size:1.35rem;}
.streak-zero{color:#E8823A; font-weight:800;}
.status-line{font-size:.85rem; color:var(--muted);}

/* ===== QUESTION ===== */
.q{
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
  transition:border-color .3s var(--ease);
}
.q-index{
  font-size:.7rem;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--gold);
  display:block;
  margin-bottom:6px;
}
.q-text{font-weight:600; margin-bottom:12px; font-size:.98rem;}
.q-options{display:flex; flex-direction:column; gap:8px;}
.option{
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  font-family:'Inter', sans-serif;
  font-size:.92rem;
  color:var(--ink);
  background:transparent;
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px 14px;
  cursor:pointer;
  transition:all .22s var(--ease);
}
.option .letter{
  flex:0 0 26px;
  height:26px;
  border-radius:50%;
  background:var(--paper);
  border:1px solid var(--line);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:.78rem;
  font-weight:700;
  color:var(--muted);
}
.option:hover{border-color:var(--gold);}
.option.selected{
  background:var(--navy);
  border-color:var(--navy);
  color:#fff;
}
.option.selected .letter{background:rgba(255,255,255,.18); border-color:transparent; color:#fff;}
.option.correct{border-color:var(--green); background:rgba(31,122,77,.08);}
.option.correct .letter{background:var(--green); border-color:var(--green); color:#fff;}
.option.wrong{border-color:var(--red); background:rgba(179,71,63,.08);}
.option.wrong .letter{background:var(--red); border-color:var(--red); color:#fff;}
.option:disabled{cursor:default;}
.q-feedback{
  margin-top:12px;
  font-size:.85rem;
  padding:10px 14px;
  border-radius:12px;
  background:var(--paper);
  border:1px solid var(--line);
  color:var(--muted);
}
.q-feedback b{color:var(--navy);}
html.dark .q-feedback b{color:var(--ink);}

/* ===== RESULT BANNER ===== */
.done-banner{
  display:none;
  text-align:center;
  padding:22px;
  border-radius:18px;
  margin-bottom:20px;
  border:1px solid rgba(184,135,63,.45);
  background:rgba(184,135,63,.08);
}
.done-banner.show{display:block;}
.done-score{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:2.2rem;
  color:var(--navy);
}
html.dark .done-score{color:var(--ink);}
.done-msg{color:var(--muted); font-size:.92rem; margin-top:6px;}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:26px 20px 34px;
  color:var(--muted);
  font-size:.82rem;
}
footer a{color:var(--navy); font-weight:600; text-decoration:none; border-bottom:1px solid rgba(184,135,63,.5);}

@media (max-width:480px){
  .logo{font-size:1rem;}
  .home-link{font-size:.8rem;}
}

/* ===== DARK MODE ===== */
html.dark{
  --paper:#0D1117;
  --paper-2:#151B24;
  --line:#2A323F;
  --ink:#E6E9EE;
  --muted:#9AA6B5;
  --muted-light:#6E7A8C;
  --white:#12171F;
  --gold:#D6A65C;
  --gold-light:#E4BE7E;
  --navy-2:#1B2433;
  --navy-soft:#26364E;
  --green:#3FB576;
  --red:#E07A6F;
  --shadow-soft:0 20px 50px -25px rgba(0,0,0,.6);
  --shadow-card:0 10px 30px -15px rgba(0,0,0,.55);
}
html.dark body{color:var(--ink);}
html.dark h1,html.dark h2,html.dark h3,html.dark h4,
html.dark .logo,html.dark footer a,html.dark .home-link,
html.dark .lang-switcher button:not(.active){
  color:var(--ink);
}
html.dark .card{background:#12171F;}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;flex:0 0 36px;border:1px solid var(--line);border-radius:50%;color:var(--ink);background:transparent;transition:border-color .3s var(--ease),color .3s var(--ease);text-decoration:none;}
.theme-toggle:hover{border-color:var(--gold);color:var(--gold);}
.theme-toggle svg{display:block;}
.theme-toggle .icon-sun{display:none;}
html.dark .theme-toggle .icon-moon{display:none;}
html.dark .theme-toggle .icon-sun{display:block;}
html.dark .lang-switcher button.active,
html.dark .btn-navy{color:#F5F6F8;background:var(--navy);}
html.dark input,html.dark select,html.dark textarea{background:#151B24;color:var(--ink);border-color:var(--line);}

/* ===== DARK MODE: light text on dark surfaces ===== */
html.dark .option.selected,
html.dark .option.selected .letter{color:#FFFFFF;}
html.dark .streak-flame{color:#FFFFFF;}

</style>
<script>(function(){var t=null;try{t=localStorage.getItem('siteTheme')}catch(e){}if(!t){try{t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){t='light'}}if(t==='dark')document.documentElement.classList.add('dark')})();</script>
</head>
<body>

<header class="topbar">
  <a class="logo" href="index.html">Abu Bakr <em>Mukhtar</em></a>
  <div class="top-actions">
    <button type="button" class="theme-toggle" aria-label="Toggle dark mode" title="Dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>

<footer><a href="index.html">© 2026 Abu Bakr Mukhtar</a> · Online English Lessons</footer>

<script>
(function(){
  var POOL = [
    {en:"Choose the correct plural of \"child\"", ar:"اختر الجمع الصحيح لكلمة child", choices:[
      {en:"children", ar:"children"},
      {en:"childs", ar:"childs"},
      {en:"childes", ar:"childes"},
      {en:"child", ar:"child"}
    ], answer:0, exEn:"The plural of \"child\" is \"children\".", exAr:"جمع child هو children."},
    {en:"Which word is a synonym of \"big\"?", ar:"أي كلمة مرادفة لكلمة big؟", choices:[
      {en:"large", ar:"large (كبير)"},
      {en:"small", ar:"small (صغير)"},
      {en:"fast", ar:"fast (سريع)"},
      {en:"short", ar:"short (قصير)"}
    ], answer:0, exEn:"\"Big\" and \"large\" mean the same thing.", exAr:"big وlarge تعنيان نفس الشيء."},
    {en:"What is the opposite of \"always\"?", ar:"ما عكس كلمة always؟", choices:[
      {en:"never", ar:"never (أبدًا)"},
      {en:"often", ar:"often (غالبًا)"},
      {en:"every day", ar:"every day (كل يوم)"},
      {en:"usually", ar:"usually (عادةً)"}
    ], answer:0, exEn:"\"Always\" is 100% of the time; \"never\" is 0%.", exAr:"always تعني دائمًا، وnever تعني أبدًا."},
    {en:"Which sentence is correct?", ar:"أي جملة صحيحة؟", choices:[
      {en:"He goes to school every day.", ar:"He goes to school every day."},
      {en:"He go to school every day.", ar:"He go to school every day."},
      {en:"He going to school every day.", ar:"He going to school every day."},
      {en:"He goes school every day.", ar:"He goes school every day."}
    ], answer:0, exEn:"With \"he\", the verb takes -s: goes.", exAr:"مع he يضاف للفعل حرف s: goes."},
    {en:"A place where you borrow books is a ...", ar:"المكان الذي تستعير منه الكتب هو ...", choices:[
      {en:"library", ar:"library (مكتبة)"},
      {en:"kitchen", ar:"kitchen (مطبخ)"},
      {en:"garden", ar:"garden (حديقة)"},
      {en:"station", ar:"station (محطة)"}
    ], answer:0, exEn:"Libraries lend books to readers.", exAr:"المكتبات تُعير الكتب للقرّاء."},
    {en:"The day between Saturday and Monday is ...", ar:"اليوم بين السبت والاثنين هو ...", choices:[
      {en:"Sunday", ar:"Sunday (الأحد)"},
      {en:"Friday", ar:"Friday (الجمعة)"},
      {en:"Thursday", ar:"Thursday (الخميس)"},
      {en:"Tuesday", ar:"Tuesday (الثلاثاء)"}
    ], answer:0, exEn:"Week order: ... Saturday, Sunday, Monday ...", exAr:"ترتيب الأسبوع: السبت ثم الأحد ثم الاثنين."},
    {en:"Tom ___ a good student.", ar:"توم ___ طالب جيد.", choices:[
      {en:"is", ar:"is"},
      {en:"are", ar:"are"},
      {en:"am", ar:"am"},
      {en:"be", ar:"be"}
    ], answer:0, exEn:"We use \"is\" with he, she, and it.", exAr:"نستخدم is مع he وshe وit."},
    {en:"Which word means the same as \"happy\"?", ar:"أي كلمة تعني نفس معنى happy؟", choices:[
      {en:"glad", ar:"glad (فرحان)"},
      {en:"sad", ar:"sad (حزين)"},
      {en:"angry", ar:"angry (غاضب)"},
      {en:"tired", ar:"tired (متعب)"}
    ], answer:0, exEn:"Happy, glad, cheerful, and joyful are near synonyms.", exAr:"happy وglad وcheerful كلمات متقاربة المعنى."},
    {en:"How many letters are in the word \"English\"?", ar:"كم عدد الحروف في كلمة English؟", choices:[
      {en:"Seven", ar:"7 (سبعة)"},
      {en:"Five", ar:"5 (خمسة)"},
      {en:"Six", ar:"6 (ستة)"},
      {en:"Eight", ar:"8 (ثمانية)"}
    ], answer:0, exEn:"E-N-G-L-I-S-H is seven letters.", exAr:"English تتكون من 7 أحرف."},
    {en:"What is the opposite of \"fast\"?", ar:"ما عكس كلمة fast؟", choices:[
      {en:"slow", ar:"slow (بطيء)"},
      {en:"quick", ar:"quick (سريع)"},
      {en:"early", ar:"early (مبكر)"},
      {en:"light", ar:"light (خفيف)"}
    ], answer:0, exEn:"Slow is the opposite of fast.", exAr:"عكس fast هو slow."},
    {en:"Choose the correct question:", ar:"اختر صيغة السؤال الصحيحة:", choices:[
      {en:"Do you like pizza?", ar:"Do you like pizza?"},
      {en:"You like pizza?", ar:"You like pizza?"},
      {en:"Like you pizza?", ar:"Like you pizza?"},
      {en:"Do you liking pizza?", ar:"Do you liking pizza?"}
    ], answer:0, exEn:"Questions in the present use \"do\" + base verb.", exAr:"أسئلة المضارع تستخدم do مع الفعل الأساسي."},
    {en:"A \"penny\" is ...", ar:"الـ penny هي ...", choices:[
      {en:"a small coin", ar:"عملة صغيرة"},
      {en:"a big box", ar:"صندوق كبير"},
      {en:"a kind of tree", ar:"نوع من الأشجار"},
      {en:"an animal", ar:"حيوان"}
    ], answer:0, exEn:"A penny is a small unit of money.", exAr:"الـ penny هي عملة صغيرة."}
  ];

  function todayKey(){
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1 < 10 ? '0' : '') + (d.getMonth() + 1) + '-' + (d.getDate() < 10 ? '0' : '') + d.getDate();
  }
  function yesterdayKey(){
    var d = new Date();
    d.setDate(d.getDate() - 1);
    return d.getFullYear() + '-' + (d.getMonth() + 1 < 10 ? '0' : '') + (d.getMonth() + 1) + '-' + (d.getDate() < 10 ? '0' : '') + d.getDate();
  }
  function hash(s){
    var h = 0;
    for (var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; }
    return h >>> 0;
  }
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function pick3(seed){
    var rnd = mulberry32(hash(seed));
    var a = POOL.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(rnd() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a.slice(0, 3);
  }

  var LANG = 'en';
  var day = todayKey();
  var questions = pick3(day);
  var chosen = {};   // qIndex -> option index
  var locked = false;
  var streak = readStreak();

  var letters = ['A', 'B', 'C', 'D'];

  function readStreak(){
    try {
      var raw = JSON.parse(localStorage.getItem('challengeStreak') || 'null');
      if (!raw || typeof raw.count !== 'number' || !raw.date) return {count:0, date:''};
      return raw;
    } catch (e) { return {count:0, date:''}; }
  }
  function saveStreak(){
    try { localStorage.setItem('challengeStreak', JSON.stringify(streak)); } catch (e) {}
  }

  function fmtDate() { return day; }

  function render(){
    var root = document.getElementById('questionRoot');
    var done = readDone();
    root.innerHTML = '';
    questions.forEach(function(q, i){
      var el = document.createElement('div');
      el.className = 'q';
      var opts = q.choices.map(function(c, j){
        var cls = 'option';
        if (done && done.date === day) {
          if (j === q.answer) cls += ' correct';
          else if (chosen[i] === j) cls += ' wrong';
        } else if (chosen[i] === j) {
          cls += ' selected';
        }
        return '<button type="button" class="' + cls + '" data-q="' + i + '" data-o="' + j + '"' + (locked ? ' disabled' : '') + '>' +
          '<span class="letter">' + letters[j] + '</span><span>' + c[LANG] + '</span></button>';
      }).join('');
      var fb = '';
      if (done && done.date === day) {
        var ok = chosen[i] === q.answer;
        fb = '<div class="q-feedback"><b>' + (ok ? (LANG==='ar'?'إجابة صحيحة ✓':'Correct ✓') : (LANG==='ar'?'إجابة خاطئة ✗':'Wrong ✗')) + '</b> · ' + q[LANG==='ar'?'exAr':'exEn'] + '</div>';
      } else if (chosen[i] !== undefined) {
        var ok = chosen[i] === q.answer;
        fb = '<div class="q-feedback"><b>' + (ok ? (LANG==='ar'?'إجابة صحيحة ✓':'Correct ✓') : (LANG==='ar'?'إجابة خاطئة ✗':'Wrong ✗')) + '</b> · ' + (q[LANG==='ar'?'exAr':'exEn']) + '</div>';
      }
      el.innerHTML =
        '<span class="q-index">' + (LANG==='ar'?'سؤال':'Question') + ' ' + (i + 1) + ' / 3</span>' +
        '<p class="q-text">' + q[LANG] + '</p>' +
        '<div class="q-options">' + opts + '</div>' + fb;
      root.appendChild(el);
    });

    root.querySelectorAll('.option').forEach(function(o){
      o.addEventListener('click', function(){
        if (locked) return;
        var qi = parseInt(o.getAttribute('data-q'), 10);
        var oi = parseInt(o.getAttribute('data-o'), 10);
        chosen[qi] = oi;
        render();
        maybeFinish();
      });
    });
  }

  function answerCount(){ return Object.keys(chosen).length; }

  function maybeFinish(){
    if (answerCount() === questions.length) {
      locked = true;
      var score = 0;
      questions.forEach(function(q, i){ if (chosen[i] === q.answer) score++; });
      // streak update
      if (streak.date === yesterdayKey()) streak.count += 1;
      else if (streak.date === day) { /* already counted */ }
      else streak.count = 1;
      streak.date = day;
      saveStreak();
      // persist done
      var done = {date: day, score: score};
      try { localStorage.setItem('challengeDone', JSON.stringify(done)); } catch (e) {}
      showDone(score);
      render();
      updateStreakUI();
    }
  }

  function readDone(){
    try {
      var d = JSON.parse(localStorage.getItem('challengeDone') || 'null');
      return d && d.date === day ? d : {date:''};
    } catch (e) { return {date:''}; }
  }

  function showDone(score){
    var b = document.getElementById('doneBanner');
    b.classList.add('show');
    document.getElementById('doneScore').textContent = score + ' / 3';
    var msg = '';
    if (score === 3) msg = LANG==='ar' ? 'ممتاز! خط ساخن 3/3 — حافظ على السلسلة!' : 'Perfect! 3 out of 3 — keep the streak alive!';
    else if (score === 2) msg = LANG==='ar' ? 'رائع! اقتربت من الكمال.' : 'Great! So close to a perfect score.';
    else msg = LANG==='ar' ? 'لا بأس — الغد يوم جديد لتشعل السلسلة.' : 'No worries — tomorrow is a new chance to build your streak.';
    document.getElementById('doneMsg').textContent = msg;
  }

  function updateStreakUI(){
    var lab = document.getElementById('streakLabel');
    if (streak.count > 0) {
      lab.innerHTML = '<span class="streak-num">' + streak.count + '</span> <span id="streakTxt"></span>';
      document.getElementById('streakTxt').textContent = LANG === 'ar' ? 'يوم متتالٍ' : 'day streak';
    } else {
      lab.innerHTML = '<span class="streak-zero">' + (LANG === 'ar' ? 'ابدأ سلسلتك اليوم!' : 'Start your streak today!') + '</span>';
    }
  }

  function updateStatus(){
    var s = document.getElementById('statusLine');
    var done = readDone();
    if (done.date === day) {
      s.textContent = LANG === 'ar' ? 'أنجزت تحدي اليوم — عد غدًا لتشعل السلسلة.' : 'Today\'s challenge is done — come back tomorrow to keep it alive.';
    } else {
      s.textContent = LANG === 'ar' ? 'كل 3 إجابات صحيحة؟ ثم وجّه السلسلة لتشتعل.' : 'Answer all three, then make it 3/3 to keep the fire going.';
    }
  }

  // ===== TRANSLATION =====
  var original = new WeakMap();
  function translateChrome(l){
    var dict = {
      "Daily Challenge": "التحدي اليومي",
      "Three Questions a Day": "ثلاثة أسئلة يوميًا",
      "Answer today's three questions, keep your streak alive, and build the habit of touching English every single day.": "أجب على أسئلة اليوم الثلاثة، وحافظ على سلسلة أيامك، وابنِ عادة ملامسة الإنجليزية كل يوم.",
      "Back to Home": "العودة للرئيسية",
      "© 2026 Abu Bakr Mukhtar": "© 2026 أبو بكر مختار",
      "Online English Lessons": "دروس إنجليزية أونلاين"
    };
    var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    var nodes = [];
    var n;
    while ((n = w.nextNode())) nodes.push(n);
    nodes.forEach(function(x){
      var p = x.parentElement;
      if (!p || ['SCRIPT', 'STYLE'].includes(p.tagName)) return;
      if (p.closest && p.closest('#questionRoot')) return;
      if (!original.has(x)) original.set(x, x.nodeValue);
      var en = original.get(x).trim();
      if (!en) return;
      if (l === 'ar' && dict[en]) {
        x.nodeValue = x.nodeValue.replace(en, dict[en]);
      } else if (l === 'en') {
        x.nodeValue = original.get(x);
      }
    });
  }

  function apply(l){
    LANG = l;
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('#langSwitcher button').forEach(function(b){
      b.classList.toggle('active', b.dataset.lang === l);
    });
    translateChrome(l);
    updateStatus();
    updateStreakUI();
    var done = readDone();
    document.getElementById('doneScore').textContent = done.score + ' / 3';
    render();
  }

  document.querySelectorAll('#langSwitcher button').forEach(function(b){
    b.addEventListener('click', function(){ apply(b.dataset.lang); });
  });

  // init
  var done = readDone();
  if (done.date === day) {
    locked = true;
    // reconstruct chosen from stored? we can't; simplest: lock and show answers with chosen empty (no wrong marking)
    // Better: don't allow play again; show done banner + questions marked correct only.
    var b = document.getElementById('doneBanner');
    b.classList.add('show');
    document.getElementById('doneScore').textContent = done.score + ' / 3';
    showDone(done.score);
  }

  var s = null;
  try { s = localStorage.getItem('siteLanguage'); } catch (e) {}
  if (!s) {
    var nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
    s = nav.indexOf('ar') === 0 ? 'ar' : 'en';
  }
  apply(s);
})();
</script>

<script src="assets/theme.js"></script>
</body>

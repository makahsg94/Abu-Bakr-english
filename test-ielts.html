<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Mini Test | Abu Bakr Mukhtar</title>
<meta name="description" content="A quick 7-question IELTS readiness check with listening, reading, and grammar — instant result, no sign-up.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0F1B2E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --navy: #0F1B2E;
  --paper: #FBF9F5;
  --line: #E4E0D6;
  --ink: #17212F;
  --muted: #5B6472;
  --gold: #B8873F;
  --white: #ffffff;
  --ease: cubic-bezier(.25,.8,.35,1);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-family:'Inter', sans-serif;
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 520px at 85% -10%, rgba(184,135,63,0.12), transparent 60%),
    radial-gradient(700px 480px at 0% 110%, rgba(15,27,46,0.06), transparent 55%),
    var(--paper);
}

/* ===== TOP BAR ===== */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:18px clamp(20px, 5vw, 48px);
}
.logo{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:1.15rem;
  color:var(--navy);
  text-decoration:none;
  letter-spacing:-0.01em;
}
.logo em{color:var(--gold); font-style:normal;}
.top-actions{display:flex; align-items:center; gap:14px;}
.home-link{
  font-size:.85rem;
  font-weight:600;
  color:var(--navy);
  text-decoration:none;
  border-bottom:2px solid rgba(184,135,63,.5);
  padding-bottom:2px;
}
.home-link:hover{border-color:var(--gold);}

/* ===== LANGUAGE SWITCHER ===== */
.lang-switcher{
  display:inline-flex;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px;
  gap:2px;
}
.lang-switcher button{
  border:0;
  background:transparent;
  font-family:'Inter', sans-serif;
  font-weight:600;
  font-size:.78rem;
  padding:7px 14px;
  border-radius:999px;
  cursor:pointer;
  color:var(--muted);
  transition:all .25s var(--ease);
}
.lang-switcher button.active{background:var(--navy); color:var(--white);}
.lang-switcher button:not(.active):hover{color:var(--navy);}

/* ===== QUIZ LAYOUT ===== */
main{
  flex:1;
  width:100%;
  max-width:720px;
  margin:0 auto;
  padding:12px clamp(20px, 5vw, 32px) 64px;
}
.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:26px;
  padding:clamp(28px, 6vw, 48px);
  box-shadow:0 30px 70px -35px rgba(15,27,46,0.35);
}
.screen{display:none;}
.screen.active{display:block; animation:cardIn .5s var(--ease) both;}
@keyframes cardIn{
  from{opacity:0; transform:translateY(16px);}
  to{opacity:1; transform:none;}
}

.eyebrow{
  display:inline-block;
  font-size:.75rem;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:14px;
}
h1{
  font-family:'Fraunces', serif;
  font-weight:600;
  color:var(--navy);
  font-size:clamp(1.8rem, 5vw, 2.4rem);
  letter-spacing:-0.01em;
  line-height:1.12;
  margin-bottom:16px;
}
.intro-text{
  color:var(--muted);
  font-size:1rem;
  max-width:520px;
  margin-bottom:26px;
}
.meta-chips{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:34px;
}
.chip{
  font-size:.78rem;
  font-weight:600;
  color:var(--navy);
  background:rgba(184,135,63,0.09);
  border:1px solid rgba(184,135,63,0.25);
  padding:7px 15px;
  border-radius:999px;
}

/* ===== BUTTONS ===== */
.btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-family:'Inter', sans-serif;
  font-size:.95rem;
  font-weight:600;
  padding:15px 30px;
  border-radius:999px;
  cursor:pointer;
  text-decoration:none;
  border:1px solid transparent;
  transition:all .3s var(--ease);
}
.btn-gold{
  background:linear-gradient(135deg, #C99547, var(--gold));
  color:var(--white);
  box-shadow:0 14px 28px -12px rgba(184,135,63,.65);
}
.btn-gold:hover{transform:translateY(-2px); box-shadow:0 20px 34px -12px rgba(184,135,63,.75);}
.btn-navy{background:var(--navy); color:var(--white);}
.btn-navy:hover{transform:translateY(-2px); box-shadow:0 16px 30px -14px rgba(15,27,46,.6);}
.btn-ghost{background:transparent; color:var(--navy); border-color:var(--line);}
.btn-ghost:hover{border-color:var(--gold); color:var(--gold);}
.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none !important;
  box-shadow:none;
}
.result-actions{display:flex; gap:14px; flex-wrap:wrap;}

/* ===== PROGRESS ===== */
.progress-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}
.qcount{font-size:.85rem; font-weight:600; color:var(--muted);}
.progress-track{
  height:6px;
  background:rgba(15,27,46,0.08);
  border-radius:999px;
  overflow:hidden;
  margin-bottom:26px;
}
.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg, #C99547, var(--gold));
  border-radius:999px;
  transition:width .35s var(--ease);
}

/* ===== QUESTION ===== */
.part-tag{
  display:inline-block;
  font-size:.72rem;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--gold);
  background:rgba(184,135,63,0.1);
  border:1px solid rgba(184,135,63,.25);
  border-radius:999px;
  padding:5px 14px;
  margin-bottom:14px;
}
.question{
  font-family:'Fraunces', serif;
  font-weight:500;
  color:var(--navy);
  font-size:clamp(1.15rem, 3.4vw, 1.4rem);
  line-height:1.35;
  margin-bottom:22px;
}
.listen-box{
  margin-bottom:14px;
}
.listen-box audio{width:100%;}
.listen-note{
  font-size:.8rem;
  color:var(--muted);
  margin-bottom:12px;
}
.read-passage{
  background:var(--paper);
  border:1px solid var(--line);
  border-left:3px solid var(--gold);
  border-radius:14px;
  padding:16px 18px;
  margin-bottom:16px;
  font-size:.94rem;
  color:var(--ink);
}
.options{display:grid; gap:12px;}
.option{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  text-align:start;
  font-family:'Inter', sans-serif;
  font-size:.98rem;
  font-weight:500;
  color:var(--ink);
  background:var(--paper);
  border:1.5px solid var(--line);
  border-radius:14px;
  padding:15px 18px;
  cursor:pointer;
  transition:all .25s var(--ease);
}
.option:hover{border-color:var(--gold); transform:translateX(4px);}
[dir="rtl"] .option:hover{transform:translateX(-4px);}
.option .letter{
  flex-shrink:0;
  width:32px; height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:var(--white);
  border:1.5px solid var(--line);
  font-size:.8rem;
  font-weight:700;
  color:var(--gold);
  transition:all .25s var(--ease);
}
.option.selected{
  background:var(--navy);
  border-color:var(--navy);
  color:var(--white);
}
.option.selected .letter{
  background:var(--gold);
  border-color:var(--gold);
  color:var(--white);
}
.quiz-next{margin-top:28px;}

/* ===== RESULT ===== */
.score-circle{
  width:150px; height:150px;
  margin:6px auto 20px;
  border-radius:50%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at 30% 25%, #16304F, var(--navy));
  box-shadow:0 22px 44px -18px rgba(15,27,46,.55);
  animation:pop .6s var(--ease) both;
}
@keyframes pop{
  from{opacity:0; transform:scale(.7);}
  to{opacity:1; transform:scale(1);}
}
.score-circle b{
  font-family:'Fraunces', serif;
  font-size:2.4rem;
  font-weight:600;
  color:var(--white);
  line-height:1;
}
.score-circle span{font-size:.85rem; color:#C99547; font-weight:600;}
.result-sub{text-align:center; color:var(--muted); font-size:.95rem; margin-bottom:24px;}
.level-badge{
  display:block;
  width:fit-content;
  margin:0 auto 18px;
  font-family:'Fraunces', serif;
  font-size:1.2rem;
  font-weight:600;
  color:var(--white);
  padding:12px 28px;
  border-radius:999px;
  box-shadow:0 12px 26px -12px rgba(15,27,46,.45);
}
.level-badge.lv1{background:#5B8C5A;}
.level-badge.lv2{background:#3F7D8C;}
.level-badge.lv3{background:#3B6EA5;}
.level-badge.lv4{background:linear-gradient(135deg, #C99547, var(--gold));}
.result-msg{
  max-width:520px;
  margin:0 auto 32px;
  text-align:center;
  color:var(--muted);
  font-size:.97rem;
}
.result-label{
  display:block;
  text-align:center;
  font-size:.78rem;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:10px;
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:26px 20px 34px;
  color:var(--muted);
  font-size:.82rem;
}
footer a{color:var(--navy); font-weight:600; text-decoration:none; border-bottom:1px solid rgba(184,135,63,.5);}

@media (max-width:480px){
  .logo{font-size:1rem;}
  .home-link{font-size:.8rem;}
  .option{padding:13px 14px; font-size:.92rem;}
  .result-actions .btn{width:100%; justify-content:center;}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="logo" href="index.html">Abu Bakr <em>Mukhtar</em></a>
  <div class="top-actions">
    <div class="lang-switcher" id="langSwitcher" aria-label="Language switcher">
      <button type="button" data-lang="en" class="active">EN</button>
      <button type="button" data-lang="ar">AR</button>
    </div>
    <a class="home-link" href="index.html">Home</a>
  </div>
</header>

<main>
  <div class="card">

    <!-- START SCREEN -->
    <section class="screen active" id="startScreen">
      <span class="eyebrow">IELTS Mini Test</span>
      <h1>IELTS Readiness Check</h1>
      <p class="intro-text">A short 7-question check to see how ready you are for IELTS preparation — listening, reading, and grammar.</p>
      <div class="meta-chips">
        <span class="chip">7 Questions</span>
        <span class="chip">~4 minutes</span>
        <span class="chip">Listening included</span>
      </div>
      <button class="btn btn-gold" id="startBtn" type="button">
        Start the Test
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </section>

    <!-- QUIZ SCREEN -->
    <section class="screen" id="quizScreen">
      <div class="progress-head">
        <span class="qcount" id="qCount"></span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="part-tag" id="partTag"></span>
      <div class="listen-box" id="listenBox" hidden>
        <audio id="listenAudio" controls preload="metadata"></audio>
      </div>
      <p class="listen-note" id="listenNote" hidden></p>
      <div class="read-passage" id="readPassage" hidden></div>
      <h2 class="question" id="questionText"></h2>
      <div class="options" id="optionsBox"></div>
      <button class="btn btn-navy quiz-next" id="nextBtn" type="button" disabled>Next Question</button>
    </section>

    <!-- RESULT SCREEN -->
    <section class="screen" id="resultScreen">
      <div class="score-circle"><b id="scoreNum"></b><span>/ 7</span></div>
      <p class="result-sub" id="resultSub"></p>
      <span class="result-label" id="levelLabel"></span>
      <div class="level-badge" id="levelBadge"></div>
      <p class="result-msg" id="resultMsg"></p>
      <div class="result-actions">
        <a class="btn btn-gold" id="bookBtn" href="#" target="_blank" rel="noopener">Book a Trial Lesson</a>
        <button class="btn btn-ghost" id="retakeBtn" type="button">Retake the Test</button>
      </div>
    </section>

  </div>
</main>

<footer><a href="index.html">© 2026 Abu Bakr Mukhtar</a> · Online English Lessons</footer>

<script>
(function(){
  const QUESTIONS = [{"t":"listen","audio":"assets/audio/ielts-l1.mp3","q":"What time will the library close this evening?","o":["At five","At six","At seven"],"a":0},{"t":"listen","audio":"assets/audio/ielts-l2.mp3","q":"How long should you spend planning your writing answer?","o":["Five minutes","Fifteen minutes","Twenty minutes"],"a":0},{"t":"read","text":"IELTS academic writing takes around 60 minutes in total. Task 1 asks you to describe a chart in about 150 words, while Task 2 is a longer essay of at least 250 words. Many test takers lose points because they run out of time, so planning your answer is essential.","q":"What does Task 1 ask you to do?","o":["Describe a chart","Write a 250-word essay","Summarize a conversation"],"a":0},{"t":"read","text":"IELTS academic writing takes around 60 minutes in total. Task 1 asks you to describe a chart in about 150 words, while Task 2 is a longer essay of at least 250 words. Many test takers lose points because they run out of time, so planning your answer is essential.","q":"Why do many test takers lose points?","o":["They write too few words","They run out of time","Their handwriting is unclear"],"a":1},{"t":"mc","q":"Choose the correct form: \"She ___ completed the task before the examiner arrived.\"","o":["has","have","were"],"a":0},{"t":"mc","q":"Choose the correct preposition: \"The course focuses ___ academic writing.\"","o":["in","on","at"],"a":1},{"t":"mc","q":"Choose the correct form: \"Neither of the answers ___ correct.\"","o":["are","is","were"],"a":1}];
  const BANDS = [{"min":0,"cls":"lv1","en":"Strengthen the Basics","ar":"قوّ الأساسيات","men":{"en":"A promising start. Focus on the core grammar and listening skills used in IELTS — regular practice will move you forward quickly.","ar":"بداية واعدة. ركّز على القواعد والاستماع الأساسيين المستخدمين في IELTS — والممارسة المنتظمة ستنقلك سريعًا"}},{"min":3,"cls":"lv2","en":"Building IELTS Skills","ar":"مستوى متقدم في مهارات IELTS","men":{"en":"Good progress. You already handle several key skills. A focused IELTS course will sharpen your technique and timing.","ar":"تقدم جيد. تتعامل بالفعل مع عدة مهارات رئيسية، ودورة IELTS مركزة ستصقل أسلوبك وإدارة وقتك."}},{"min":5,"cls":"lv3","en":"IELTS-Ready","ar":"جاهز لـ IELTS","men":{"en":"Well done! You are reading, listening, and using grammar with confidence. Strategy work will now turn that into higher band scores.","ar":"أحسنت! تقرأ وتستمع وتستخدم القواعد بثقة، والعمل على الاستراتيجية سيحوّل ذلك لدرجات أعلى."}},{"min":7,"cls":"lv4","en":"Excellent","ar":"ممتاز","men":{"en":"Excellent! You are operating at a strong level across all sections. Advanced exam strategy and feedback will push you to the top bands.","ar":"ممتاز! تتعامل بمستوى قوي في كل الأجزاء، والاستراتيجية المتقدمة والتقييم سيدفعانك لأعلى الدرجات."}}];
  const UI = {"en":{"q":"Question","of":"of","next":"Next Question","see":"Show My Result","sub":"You answered {s} of 7 correctly ({p}%)","lvlLabel":"Your mini-test result","retake":"Retake the Test","book":"Book a Trial Lesson","play":"Listen, then answer the question.","listen":"Listening","read":"Reading","mc":"Use of English"},"ar":{"q":"السؤال","of":"من","next":"السؤال التالي","see":"اعرض نتيجتي","sub":"أجبت إجابة صحيحة عن {s} من أصل 7 بنسبة {p}%","lvlLabel":"نتيجة اختبارك المصغر","retake":"أعد الاختبار","book":"احجز درسًا تجريبيًا","play":"استمع ثم أجب عن السؤال.","listen":"الاستماع","read":"القراءة","mc":"استخدام اللغة"}};

  function getLang(){
    try { const s = localStorage.getItem('siteLanguage'); if (s) return s; } catch(e){}
    const nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
    return nav.startsWith('ar') ? 'ar' : 'en';
  }
  function setLang(l){ try { localStorage.setItem('siteLanguage', l); } catch(e){} }

  const LETTERS = ["A","B","C"];
  let idx = 0, score = 0, selected = null;

  const $ = (id) => document.getElementById(id);

  function showScreen(name){
    ['startScreen','quizScreen','resultScreen'].forEach(s => $(s).classList.toggle('active', s === name));
  }

  function renderQuestion(){
    const l = getLang(), t = UI[l];
    const item = QUESTIONS[idx];
    selected = null;
    $('qCount').textContent = t.q + " " + (idx + 1) + " " + t.of + " 7";
    $('progressFill').style.width = (idx / QUESTIONS.length * 100) + "%";

    $('partTag').textContent = t[item.t] || t.mc;
    const lb = $('listenBox'), ln = $('listenNote');
    if (item.t === 'listen') {
      $('listenAudio').src = item.audio;
      lb.hidden = false;
      ln.hidden = false;
      ln.textContent = t.play;
    } else {
      lb.hidden = true;
      ln.hidden = true;
    }
    const rp = $('readPassage');
    if (item.t === 'read') { rp.textContent = item.text; rp.hidden = false; }
    else { rp.hidden = true; }

    $('questionText').textContent = item.q;
    const box = $('optionsBox');
    box.innerHTML = "";
    (item.o || []).forEach((optText, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'option';
      const span = document.createElement('span');
      span.className = 'letter';
      span.textContent = LETTERS[i];
      b.appendChild(span);
      b.appendChild(document.createTextNode(optText));
      b.addEventListener('click', () => selectOption(b, i));
      box.appendChild(b);
    });
    const nb = $('nextBtn');
    nb.textContent = (idx === QUESTIONS.length - 1) ? t.see : t.next;
    nb.disabled = true;
  }

  function selectOption(btn, i){
    document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    btn.classList.add('selected');
    selected = i;
    $('nextBtn').disabled = false;
  }

  function advance(){
    if (selected === null) return;
    if (selected === QUESTIONS[idx].a) score++;
    idx++;
    if (idx < QUESTIONS.length) renderQuestion(); else showResult();
  }

  function bandIndex(){
    for (let i = BANDS.length - 1; i >= 0; i--) { if (score >= BANDS[i].min) return i; }
    return 0;
  }

  function showResult(){
    const l = getLang(), t = UI[l], band = BANDS[bandIndex()];
    $('progressFill').style.width = "100%";
    $('scoreNum').textContent = score;
    const pct = Math.round(score / QUESTIONS.length * 100);
    $('resultSub').textContent = t.sub.replace("{s}", score).replace("{p}", pct);
    $('levelLabel').textContent = t.lvlLabel;
    const badge = $('levelBadge');
    badge.textContent = band[l];
    badge.className = 'level-badge ' + band.cls;
    $('resultMsg').textContent = band.men[l === 'ar' ? 'ar' : 'en'];
    $('bookBtn').href = "https://wa.me/201014416415?text=" +
      encodeURIComponent("Hello Abu Bakr, I scored {s}/7 ({band}) on your IELTS mini test. I'd like to book a lesson.".replace("{s}", score).replace("{band}", band.en));
    $('retakeBtn').textContent = t.retake;
    $('bookBtn').childNodes[$('bookBtn').childNodes.length - 1].textContent = t.book;
    showScreen('resultScreen');
  }

  $('startBtn').addEventListener('click', () => {
    idx = 0; score = 0;
    renderQuestion();
    showScreen('quizScreen');
  });
  $('nextBtn').addEventListener('click', advance);
  $('retakeBtn').addEventListener('click', () => showScreen('startScreen'));

  document.querySelectorAll('#langSwitcher button').forEach(btn => {
    btn.addEventListener('click', () => {
      setLang(btn.getAttribute('data-lang'));
      if ($('quizScreen').classList.contains('active')) renderQuestion();
      if ($('resultScreen').classList.contains('active')) { idx = QUESTIONS.length; showResult(); }
    });
  });
})();
</script>

<script>
(function(){
  const dict = {"IELTS Mini Test":"اختبار IELTS المصغر","IELTS Readiness Check":"فحص الجاهزية لـ IELTS","A short 7-question check to see how ready you are for IELTS preparation — listening, reading, and grammar.":"فحص قصير من 7 أسئلة لمعرفة مدى جاهزيتك للتحضير لامتحان IELTS — استماع وقراءة وقواعد.","7 Questions":"7 أسئلة","~4 minutes":"~4 دقائق","Listening included":"يشمل الاستماع","Start the Test":"ابدأ الاختبار","Home":"الرئيسية"};

  const originals = new WeakMap();

  function applyLangToStatic(l){
    document.documentElement.lang = l;
    document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
    document.querySelectorAll('#langSwitcher button').forEach(b =>
      b.classList.toggle('active', b.getAttribute('data-lang') === l));
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    let node;
    while ((node = walker.nextNode())) {
      const parent = node.parentElement;
      if (!parent || parent.tagName === 'SCRIPT' || parent.tagName === 'STYLE') continue;
      if (parent.closest && parent.closest('#quizScreen, #resultScreen')) continue;
      if (!originals.has(node)) originals.set(node, node.nodeValue);
      const en = originals.get(node).trim();
      if (!en) continue;
      if (l === 'ar' && dict[en]) {
        node.nodeValue = node.nodeValue.replace(en, dict[en]);
      } else if (l === 'en') {
        node.nodeValue = originals.get(node);
      }
    }
  }

  document.querySelectorAll('#langSwitcher button').forEach(btn => {
    btn.addEventListener('click', () => {
      const l = btn.getAttribute('data-lang');
      try { localStorage.setItem('siteLanguage', l); } catch(e){}
      applyLangToStatic(l);
    });
  });

  let saved = 'en';
  try { saved = localStorage.getItem('siteLanguage'); } catch(e){}
  if (!saved) {
    const nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
    saved = nav.startsWith('ar') ? 'ar' : 'en';
  }
  applyLangToStatic(saved);
})();
</script>

</body>
</html>
